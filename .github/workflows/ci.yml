name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - name: Set up Node and npm download cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Select the supported npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.2.0 --ignore-scripts --no-fund
      - name: Install the committed lockfile
        run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install matching Chromium and system dependencies
        run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:smoke
      - name: Validate current OpenSpec specs and active changes
        run: npm exec -- openspec validate --all --strict --no-interactive

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: commerce_ci
          POSTGRES_DB: commerce_ci_test
          # Public disposable fixture only; never reuse on a shared service.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U commerce_ci -d commerce_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - name: Set up Node and npm download cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Select the supported npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.2.0 --ignore-scripts --no-fund
      - name: Install the committed lockfile
        run: npm ci --no-fund
      - name: Validate actual migrations, rollback, and owned cleanup
        run: npm run test:integration
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://commerce_ci@127.0.0.1:5432/commerce_ci_test
          TEST_DATABASE_POOL_MAX: '5'
          TEST_DATABASE_ACQUIRE_TIMEOUT_MS: '1000'
          TEST_DATABASE_STATEMENT_TIMEOUT_MS: '5000'
